<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}} — Stan Chen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #f6f5f2;
    --hero-bg:     #0d0d0b;
    --text:        #1a1917;
    --text-inv:    #ede9e2;
    --muted:       #5e6370;
    --muted-inv:   rgba(237,233,226,0.50);
    --accent:      #1a7a6e;
    --accent-inv:  #4ecbbd;
    --border:      #d8d4cc;
    --surface:     #edeae3;
    --serif:       'Cormorant Garant', Georgia, serif;
    --sans:        'Inter', system-ui, sans-serif;
    --mono:        'JetBrains Mono', 'Courier New', monospace;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-weight: 300;
    font-size: 16.5px;
    line-height: 1.8;
    overflow-x: hidden;
  }

  /* ── topbar ── */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: var(--hero-bg);
    padding: 0 48px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .topbar-name {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-inv);
    text-decoration: none;
  }

  .topbar-nav {
    display: flex;
    gap: 32px;
    list-style: none;
  }

  .topbar-nav a {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted-inv);
    text-decoration: none;
    transition: color 0.2s;
  }

  .topbar-nav a:hover { color: var(--text-inv); }

  /* ── article hero ── */
  .hero {
    background: var(--hero-bg);
    padding: 132px 48px 92px;
  }

  .hero-inner {
    max-width: 800px;
    margin: 0 auto;
  }

  .hero-meta {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--accent-inv);
    text-transform: uppercase;
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 0.7s ease 0.1s forwards;
    display: flex;
    gap: 16px;
  }

  .hero-title {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(38px, 5.5vw, 64px);
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--text-inv);
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.25s forwards;
  }

  .hero-title em {
    font-style: italic;
    color: var(--muted-inv);
  }

  .hero-subtitle {
    max-width: 680px;
    font-size: 19px;
    color: var(--muted-inv);
    line-height: 1.6;
    font-weight: 300;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.4s forwards;
  }

  /* ── article container ── */
  .article-wrap {
    max-width: 800px;
    margin: 0 auto;
    padding: 64px 48px 96px;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    text-decoration: none;
    margin-bottom: 48px;
    padding-bottom: 4px;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s, gap 0.2s;
  }

  .back-btn:hover {
    border-color: var(--accent);
    gap: 12px;
  }

  .back-btn svg {
    width: 12px; height: 12px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 1.5;
    transform: rotate(180deg);
  }

  /* ── typography & content ── */
  .content {
    color: var(--text);
  }

  .content p {
    margin-bottom: 24px;
    font-size: 17px;
    line-height: 1.85;
  }

  .content p strong {
    font-weight: 500;
    color: #000;
  }

  .content h2 {
    font-family: var(--serif);
    font-size: 36px;
    font-weight: 400;
    line-height: 1.2;
    margin: 56px 0 24px;
    letter-spacing: -0.01em;
  }

  .content h2 em {
    font-style: italic;
    color: var(--muted);
  }

  .content h3 {
    font-family: var(--sans);
    font-size: 20px;
    font-weight: 600;
    margin: 36px 0 16px;
    color: var(--text);
  }

  /* ── callout card ── */
  .callout-box {
    margin: 40px 0;
    padding: 32px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    border-radius: 2px;
  }

  .callout-box h4 {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .callout-box p {
    font-size: 15.5px;
    color: var(--muted);
    margin-bottom: 0;
  }

  /* ── blockquotes ── */
  blockquote {
    font-family: var(--serif);
    font-size: 24px;
    font-style: italic;
    line-height: 1.5;
    color: var(--muted);
    padding-left: 24px;
    border-left: 1px solid var(--border);
    margin: 44px 0;
  }

  /* ── list styling ── */
  .content ul, .content ol {
    margin: 24px 0 32px 24px;
  }

  .content li {
    margin-bottom: 12px;
    font-size: 16.5px;
    color: var(--muted);
  }

  .content li strong {
    color: var(--text);
  }

  /* ── code styling ── */
  pre {
    background: var(--hero-bg);
    color: var(--text-inv);
    font-family: var(--mono);
    font-size: 13.5px;
    padding: 24px;
    border-radius: 4px;
    overflow-x: auto;
    margin: 36px 0;
    line-height: 1.6;
    border: 1px solid rgba(255,255,255,0.05);
  }

  code {
    font-family: var(--mono);
    font-size: 14.5px;
    background: var(--surface);
    padding: 2px 6px;
    border-radius: 3px;
    color: var(--accent);
  }

  pre code {
    background: none;
    padding: 0;
    color: inherit;
    font-size: inherit;
  }

  /* ── footer ── */
  footer {
    border-top: 1px solid var(--border);
    margin-top: 80px;
    padding: 40px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
  }

  .footer-name {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 300;
    font-style: italic;
    color: var(--muted);
  }

  .footer-links {
    display: flex;
    gap: 24px;
    list-style: none;
  }

  .footer-links a {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
  }

  .footer-links a:hover { color: var(--accent); }

  /* ── animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── responsive ── */
  @media (max-width: 700px) {
    .topbar     { padding: 0 24px; }
    .topbar-nav { display: none; }
    .hero       { padding: 110px 24px 68px; }
    .article-wrap { padding: 44px 24px 68px; }
    footer      { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- TOPBAR -->
<nav class="topbar">
  <a href="../index.html" class="topbar-name">stancsz</a>
  <ul class="topbar-nav">
    <li><a href="../index.html#audio">Audio</a></li>
    <li><a href="../index.html#quantum">Quantum Agentics</a></li>
    <li><a href="../index.html#music">Artist</a></li>
    <li><a href="../index.html#research">Research</a></li>
    <li><a href="../index.html#opinions">Opinions</a></li>
    <li><a href="https://github.com/stancsz" target="_blank" rel="noopener">GitHub ↗</a></li>
  </ul>
</nav>

<!-- HERO -->
<header class="hero">
  <div class="hero-inner">
    <div class="hero-meta">
      <span>{{type}}</span>
      <span>{{date}}</span>
    </div>
    <h1 class="hero-title">{{title}}</h1>
    <p class="hero-subtitle">
      {{subtitle}}
    </p>
  </div>
</header>

<!-- MAIN WRAPPER -->
<div class="article-wrap">
  <a href="../index.html#research" class="back-btn">
    <svg viewBox="0 0 10 10"><path d="M1 9 9 1M9 1H3M9 1v6"/></svg>
    Back to Notes
  </a>

  <article class="content">
    {{content}}
  </article>

  <!-- FOOTER -->
  <footer>
    <span class="footer-name">stancsz.</span>
    <ul class="footer-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="https://github.com/stancsz" target="_blank" rel="noopener">GitHub</a></li>
      <li><a href="https://github.com/stancsz/fdnr-vst3" target="_blank" rel="noopener">FDNR</a></li>
      <li><a href="https://github.com/braid-quantum" target="_blank" rel="noopener">Braid</a></li>
    </ul>
  </footer>
</div>

</body>
</html>
